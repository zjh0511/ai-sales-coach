# Render 部署設定：把這個 repo 接到 Render 就會自動讀這份檔案。
# 詳細步驟見 DEPLOY.md
services:
  - type: web
    name: ai-sales-coach
    runtime: node
    plan: free
    region: singapore
    rootDir: app
    buildCommand: ""          # 沒有任何相依套件，不需要 build
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: CLOUD
        value: "1"            # 由平台處理 HTTPS，伺服器只跑 HTTP
      - key: GEMINI_API_KEY
        sync: false           # 在 Render 後台手動填入，不會寫進 repo
      - key: ACCESS_CODE
        sync: false           # 團隊通行碼，同樣在後台填
      - key: NODE_VERSION
        value: "22"
